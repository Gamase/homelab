services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Tijuana
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config
      - /data:/data
    ports:
      - 8090:8090
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
